# =============================================================================
# manage-ue1 / tgw
# =============================================================================
manage-ue1-tgw:plan:
  extends: .terraform_base
  stage: plan
  variables:
    TF_ROOT: account/aws-manage-ue1/tgw
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - ${TF_ROOT}/tfplan
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - account/aws-manage-ue1/tgw/**/*
    - if: $CI_PIPELINE_SOURCE != "push"
      when: manual

manage-ue1-tgw:apply:
  extends: .terraform_base
  stage: apply
  resource_group: manage-ue1-tgw
  variables:
    TF_ROOT: account/aws-manage-ue1/tgw
  script:
    - terraform apply -auto-approve tfplan
  dependencies:
    - manage-ue1-tgw:plan
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - account/aws-manage-ue1/tgw/**/*
      when: manual
    - if: $CI_PIPELINE_SOURCE != "push"
      when: manual

