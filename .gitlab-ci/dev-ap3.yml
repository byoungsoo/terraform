# =============================================================================
# dev-ap3 / vpc
# =============================================================================
dev-ap3-vpc:validate:
  extends: .terraform_base
  stage: validate
  variables:
    TF_ROOT: account/aws-dev-ap3/vpc
  script:
    - terraform validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - account/aws-dev-ap3/vpc/**/*
    - when: manual
      allow_failure: true

dev-ap3-vpc:plan:
  extends: .terraform_base
  stage: plan
  variables:
    TF_ROOT: account/aws-dev-ap3/vpc
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - ${TF_ROOT}/tfplan
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - account/aws-dev-ap3/vpc/**/*
    - when: manual
      allow_failure: true

dev-ap3-vpc:apply:
  extends: .terraform_base
  stage: apply
  resource_group: dev-ap3-vpc
  variables:
    TF_ROOT: account/aws-dev-ap3/vpc
  script:
    - terraform apply -auto-approve tfplan
  dependencies:
    - dev-ap3-vpc:plan
  rules:
    - when: manual
      allow_failure: true
