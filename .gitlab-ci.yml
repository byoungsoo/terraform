# Terraform CI/CD Pipeline
#
# GitLab Runner(shared 계정)의 EC2 Instance Profile(GitlabTerraformRole)이
# 각 계정의 Terraform Role을 assume하여 배포합니다.
#
# shared (202949997891) - GitLab Runner
#   └── GitlabTerraformRole (EC2 Instance Profile)
#         ├── assume → ManageTerraformRole (692806374063)
#         ├── assume → DevTerraformRole (558846430793)
#         └── assume → SharedTerraformRole (202949997891)

include:
  - local: .gitlab-ci/dev-ap2.yml
  - local: .gitlab-ci/dev-ap3.yml
  - local: .gitlab-ci/dev-ue1.yml
  - local: .gitlab-ci/manage-ap2.yml
  - local: .gitlab-ci/manage-ap3.yml
  - local: .gitlab-ci/manage-ue1.yml

stages:
  - validate
  - plan
  - apply

variables:
  TF_VERSION: "1.14.5"

.terraform_base:
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]
  tags:
    - terraform
  before_script:
    - cd ${TF_ROOT}
    - terraform init -input=false
